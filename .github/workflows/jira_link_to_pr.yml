# Adds the Jira issue found in the branch name or title (HCK-…) to the pull request description and labels
name: Link the Jira issue

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  jira:
    uses: hackolade/github-actions/.github/workflows/jira-link-pr.yml@v1
    secrets:
      jira-token: ${{ secrets.JIRA_TOKEN }}
